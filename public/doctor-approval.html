<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doctor Dashboard</title>
<link rel="stylesheet" href="style.css">

<style>
.approve-btn, .reject-btn {
    display: inline-block;
    padding: 6px 10px;
    margin: 5px 2px;
    border: none;
    cursor: pointer;
    font-size: 12px;
}

.approve-btn {
    background-color: green;
    color: white;
}

.reject-btn {
    background-color: red;
    color: white;
}

td {
    text-align: center;
}
</style>
</head>

<body>

<header class="header">
    <nav class="nav">
        <a href="#" class="medico_logo">Medico Appointment</a>
        <ul class="nav_items" id="navItems"></ul>
    </nav>
</header>

<div class="approve-container">
    <h2>Patient Appointment Requests</h2>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status / Action</th>
            </tr>
        </thead>

        <tbody id="appointmentTable"></tbody>
    </table>
</div>

<script src="script.js"></script>

<script>
const user = JSON.parse(localStorage.getItem("user"));


if (!user || user.role !== "doctor") {
    window.location.href = "login.html";
}

// load appointments
async function loadAppointments() {
    try {
        const res = await fetch(`${BASE_URL}/doctor-appointments/${user.email}`);
        const data = await res.json();

        console.log("Appointments:", data);

        const table = document.getElementById("appointmentTable");
        table.innerHTML = "";

        if (!data || data.length === 0) {
            table.innerHTML = `<tr><td colspan="6">No Requests Available</td></tr>`;
            return;
        }

        data.forEach(a => {
            const statusColor =
                a.status === "approved" ? "green" :
                a.status === "rejected" ? "red" : "black";

            table.innerHTML += `
            <tr>
                <td>${a.patientName}</td>
                <td>${a.age}</td>
                <td>${a.patientEmail}</td>
                <td>${a.date}</td>
                <td>${a.time}</td>
                <td>
                    <b style="color:${statusColor}">
                        ${a.status || "Pending"}
                    </b><br>

                    ${a.status === "pending" || !a.status ? `
                        <button class="approve-btn" onclick="approve('${a._id}')">Approve</button>
                        <button class="reject-btn" onclick="reject('${a._id}')">Reject</button>
                    ` : ""}
                </td>
            </tr>
            `;
        });

    } catch (err) {
        console.error("Error:", err);
    }
}

// APPROVE
async function approve(id) {
    try {
        const res = await fetch(BASE_URL + "/approve-appointment", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ id })
        });

        const data = await res.json();
        if (res.ok) {
    alert(data.message);
} else {
    alert("Something went wrong");
}
        loadAppointments(); 

    } catch (err) {
        console.error(err);
        alert("Error approving");
    }
}

//  REJECT
async function reject(id) {
    try {
        const res = await fetch(BASE_URL + "/reject-appointment", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ id })
        });

        const data = await res.json();
       if (res.ok) {
    alert(data.message);
} else {
    alert("Something went wrong");
}

        loadAppointments(); 

    } catch (err) {
        console.error(err);
        alert("Error rejecting");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    loadNavbar();
    loadAppointments();
});
</script>

</body>
</html>
