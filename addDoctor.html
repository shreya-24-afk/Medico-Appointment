<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Doctors</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <nav class="nav">
        <a href="#" class="medico_logo">Medico Appointment</a>
        <ul class="nav_items" id="navItems"></ul>
                
    </nav>
</header>

<form id="doctorForm" enctype="multipart/form-data">
    <div class="container">
    <h2>Add Doctor</h2>

    <input type="text" name="name" placeholder="Name" required><br><br>
    <input type="email" name="email" placeholder="Email" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <input type="text" name="qualification" placeholder="Qualification"><br><br>
    <input type="text" name="speciality" placeholder="Speciality"><br><br>
    <input type="number" name="experience" placeholder="Experience"><br><br>
    <input type="number" name="contactNo" placeholder="Contact No"><br><br>
    <input type="file" name="image"><br><br>

   <button type="submit">Add Doctor</button>
    </div>
</form>



<script src="script.js"></script>

<script>
document.getElementById("doctorForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    try {
        const res = await fetch(BASE_URL + "/add-doctor", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        console.log(data);

        if (res.ok) {
            alert("Doctor added successfully");

           
            document.getElementById("doctorForm").reset();
        } else {
            alert(data.message || "Error adding doctor");
        }

    } catch (err) {
        console.error(err);
        alert("Server error");
    }
});
</script>

</body>
</html>
